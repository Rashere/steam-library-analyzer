<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Library Analyzer</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f8f9fa; }
    input, button { padding: 10px; margin: 8px 0; width: 100%; max-width: 500px; }
    .options { text-align: left; margin-top: 10px; }
    .options label { display: block; margin: 5px 0; }
    .error { color: red; }
    .container { max-width: 600px; margin: auto; text-align: center; }
    .recommendations, .similar-games, .genres { background: #e9f7ef; color: #155724; padding: 10px; margin-top: 15px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Steam Library Analyzer</h1>
    <p>Enter your SteamID64 or Profile URL and Steam API Key to analyze your library and get recommendations prioritized by positive reviews.</p>
    <input id="steamID" placeholder="SteamID64 or Profile URL" />
    <input id="apiKey" placeholder="Steam API Key" />
    <div class="options">
      <label><input type="checkbox" id="includeEarlyAccess" checked /> Include Early Access games</label>
      <label><input type="checkbox" id="includeDemos" checked /> Include Demos</label>
      <label><input type="checkbox" id="excludeOwned" /> Exclude games I already own</label>
      <label><input type="number" id="minReviewScore" placeholder="Min Review Score (0-10)" min="0" max="10" step="0.1" /></label>
      <label><input type="number" id="minReviewCount" placeholder="Min Review Count" min="0" step="1" /></label>
    </div>
    <button onclick="fetchSteamData()">Analyze My Library</button>
    <div id="recommendations" class="recommendations" style="display:none;"></div>
    <div id="topGenres" class="genres" style="display:none;"></div>
    <div id="similarGames" class="similar-games" style="display:none;"></div>
    <button id="downloadBtn" style="display:none;" onclick="downloadCSV()">Download CSV</button>
  </div>
  <script>
    let lastData = null;

    window.onload = function() {
      const savedSteamID = localStorage.getItem('steamID');
      const savedApiKey = localStorage.getItem('apiKey');
      if (savedSteamID) document.getElementById('steamID').value = savedSteamID;
      if (savedApiKey) document.getElementById('apiKey').value = savedApiKey;
    };

    async function resolveSteamID64(input, apiKey) {
      if (/^\d{17}$/.test(input)) return input;
      const vanityUrl = input.replace("https://steamcommunity.com/id/", "").replace(/\/$/, "");
      const url = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://api.steampowered.com/ISteamUser/ResolveVanityURL/v0001/?key=${apiKey}&vanityurl=${vanityUrl}`)}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Steam API error: ${response.status}`);
      const data = await response.json();
      if (data.response.success === 1) return data.response.steamid;
      throw new Error("Failed to resolve vanity URL. Check your Profile URL and API Key.");
    }

    async function fetchSteamData() {
      const steamIDInput = document.getElementById('steamID').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      localStorage.setItem('steamID', steamIDInput);
      localStorage.setItem('apiKey', apiKey);
      const includeEarlyAccess = document.getElementById('includeEarlyAccess').checked;
      const includeDemos = document.getElementById('includeDemos').checked;
      const excludeOwned = document.getElementById('excludeOwned').checked;
      const minReviewScore = parseFloat(document.getElementById('minReviewScore').value) || 0;
      const minReviewCount = parseInt(document.getElementById('minReviewCount').value) || 0;
      const recommendations = document.getElementById('recommendations');
      const topGenres = document.getElementById('topGenres');
      const similarGames = document.getElementById('similarGames');
      recommendations.style.display = "none";
      topGenres.style.display = "none";
      similarGames.style.display = "none";
      try {
        const steamID = await resolveSteamID64(steamIDInput, apiKey);
        const gamesURL = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://api.steampowered.com/IPlayerService/GetOwnedGames/v0001/?key=${apiKey}&steamid=${steamID}&include_appinfo=true&format=json`)}`;
        const response = await fetch(gamesURL);
        if (!response.ok) throw new Error(`Steam API error: ${response.status}`);
        const data = await response.json();
        lastData = data;
        document.getElementById('downloadBtn').style.display = "inline-block";
        await showRecommendations(data, apiKey);
        fetchSimilarGames(data, includeEarlyAccess, includeDemos, excludeOwned, minReviewScore, minReviewCount);
      } catch (err) {
        console.error(err);
        recommendations.innerHTML = `<p class="error">${err.message}</p>`;
        recommendations.style.display = "block";
      }
    }

    async function showRecommendations(data, apiKey) {
      const recommendations = document.getElementById('recommendations');
      const topGenres = document.getElementById('topGenres');
      const games = data.response.games;
      if (!games || games.length === 0) {
        recommendations.innerHTML = "No games found to analyze.";
        recommendations.style.display = "block";
        return;
      }
      const weightedGames = weightedSort(games).slice(0, 5);
      const details = weightedGames.map(g => `<li>${g.name} - ${g.hoursPlayed} hrs, Last Played: ${g.lastPlayed}</li>`).join("");
      recommendations.innerHTML = `<strong>Your Top Weighted Games:</strong><ul>${details}</ul>`;
      recommendations.style.display = "block";

      let genreCount = {};
      for (let game of weightedGames) {
        const appId = game.appid;
        const url = `https://store.steampowered.com/api/appdetails?appids=${appId}`;
        try {
          const response = await fetch(url);
          const appData = await response.json();
          const genres = appData[appId].data.genres?.map(g => g.description) || [];
          genres.forEach(genre => {
            genreCount[genre] = (genreCount[genre] || 0) + 1;
          });
        } catch (e) {
          console.warn("Failed to fetch genres for appId:", appId);
        }
      }
      const sortedGenres = Object.entries(genreCount).sort((a, b) => b[1] - a[1]);
      const genreDetails = sortedGenres.map(([genre, count]) => `<li>${genre} (${count} top games)</li>`).join("");
      topGenres.innerHTML = `<strong>Your Top Genres:</strong><ul>${genreDetails}</ul>`;
      topGenres.style.display = "block";
    }

    async function fetchSimilarGames(data, includeEarlyAccess, includeDemos, excludeOwned, minReviewScore, minReviewCount) {
      const similarGames = document.getElementById('similarGames');
      const ownedAppIds = new Set(data.response.games.map(g => g.appid));
      const weightedGames = weightedSort(data.response.games).slice(0, 3);
      let suggestions = [];
      for (let game of weightedGames) {
        const appId = game.appid;
        const url = `https://store.steampowered.com/api/appdetails?appids=${appId}`;
        try {
          const response = await fetch(url);
          const appData = await response.json();
          const genres = appData[appId].data.genres?.map(g => g.description);
          if (genres) suggestions.push(...genres);
        } catch (e) {
          console.warn("Failed to fetch details for appId:", appId);
        }
      }
      if (suggestions.length === 0) {
        similarGames.innerHTML = "Couldn’t fetch genres for recommendations.";
        similarGames.style.display = "block";
        return;
      }
      const uniqueGenres = [...new Set(suggestions)];

      let recommendedGames = [];
      for (let genre of uniqueGenres) {
        try {
          const searchUrl = `https://store.steampowered.com/api/storesearch/?cc=us&l=en&term=${encodeURIComponent(genre)}&page=1`;
          const searchResponse = await fetch(searchUrl);
          const searchData = await searchResponse.json();
          const filtered = searchData.items.filter(item => {
            if (!includeEarlyAccess && item.release_date && item.release_date.early_access) return false;
            if (!includeDemos && item.type === "Demo") return false;
            if (excludeOwned && ownedAppIds.has(item.id)) return false;
            if (item.review_score < minReviewScore * 10) return false;
            if (item.review_count && item.review_count < minReviewCount) return false;
            return true;
          });
          filtered.sort((a, b) => b.review_score - a.review_score);
          recommendedGames.push(...filtered.map(g => ({
            name: g.name,
            link: `https://store.steampowered.com/app/${g.id}/`,
            reason: `Recommended because you like ${genre}`,
            reviewScore: g.review_score ? `${g.review_score}/10` : 'No score'
          })));
        } catch (e) {
          console.warn("Failed to fetch recommended games for genre:", genre);
        }
      }
      const uniqueRecommendations = recommendedGames.reduce((acc, curr) => {
        if (!acc.find(g => g.name === curr.name)) acc.push(curr);
        return acc;
      }, []).slice(0, 10);

      similarGames.innerHTML = `<strong>Recommended Games Based on Your Genres:</strong><ul>` +
        uniqueRecommendations.map(g => `<li><a href="${g.link}" target="_blank">${g.name}</a> - ${g.reason}<br>Review Score: ${g.reviewScore}</li>`).join("") +
        `</ul>`;
      similarGames.style.display = "block";
    }

    function downloadCSV() {
      if (!lastData || !lastData.response || !lastData.response.games) {
        alert("No game data available to export.");
        return;
      }
      const games = lastData.response.games;
      const headers = ["AppID", "Name", "Playtime (Hours)"];
      const rows = games.map(game => [
        game.appid,
        game.name.replace(/"/g, '""'),
        (game.playtime_forever / 60).toFixed(2)
      ]);
      let csvContent = "data:text/csv;charset=utf-8," + headers.join(",") + "\n" + rows.map(r => r.join(",")).join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "steam_library.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
