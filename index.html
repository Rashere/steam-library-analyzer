<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steam Library Analyzer</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #f5f5f5; margin: 0; padding: 0; }
    .container { max-width: 900px; margin: auto; padding: 20px; }
    h1 { color: #00adee; text-align: center; margin-bottom: 20px; }
    label { display: block; margin: 12px 0 6px; font-weight: 500; }
    input, select, button {
      width: 100%; max-width: 600px; padding: 10px; border: none; border-radius: 6px; margin-bottom: 15px;
      font-size: 1rem;
    }
    input, select { background: #1e1e1e; color: #f5f5f5; }
    button {
      background: #00adee; color: #fff; cursor: pointer; transition: background 0.3s ease;
    }
    button:hover { background: #007fa3; }
    .card {
      background: #1e1e1e; padding: 15px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.5); margin: 10px 0;
    }
    .card a { color: #00adee; font-size: 1.1rem; text-decoration: none; }
    .price { font-weight: bold; display: block; margin-top: 5px; }
    .discount-high { color: #4caf50; }
    .discount-medium { color: #ff9800; }
    .discount-none { color: #f5f5f5; }
    .error { color: #f44336; margin-top: 10px; }
    h2 { border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 25px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Steam Library Analyzer</h1>

    <label>SteamID64 or Profile URL:</label>
    <input type="text" id="steamId" placeholder="Enter SteamID64 or Profile URL">
    <label>Steam API Key:</label>
    <input type="text" id="apiKey" placeholder="Enter your Steam API key">
    <label>Region:</label>
    <select id="region">
      <option value="us">US</option>
      <option value="eu">EU</option>
      <option value="uk">UK</option>
      <option value="jp">JP</option>
    </select>
    <label><input type="checkbox" id="excludeOwned"> Exclude games I already own</label>
    <label><input type="checkbox" id="earlyAccess"> Include Early Access</label>
    <label><input type="checkbox" id="demos"> Include Demos</label>
    <label><input type="checkbox" id="onlyOnSale"> Show Only Games on Sale</label>
    <label>Min Review Score (0-10):</label>
    <input type="number" id="minReviewScore" placeholder="e.g. 7">
    <label>Min Review Count:</label>
    <input type="number" id="minReviewCount" placeholder="e.g. 100">
    <label>Sort by:</label>
    <select id="sortBy">
      <option value="default">Default</option>
      <option value="price">Price (Low → High)</option>
      <option value="discount">Biggest Discount</option>
    </select>
    <button onclick="analyzeLibrary()">Analyze</button>
    <button onclick="downloadCSV()">Download CSV</button>

    <div id="output"></div>
  </div>

  <script>
    window.onload = function() {
      document.getElementById('apiKey').value = localStorage.getItem('apiKey') || '';
      document.getElementById('steamId').value = localStorage.getItem('steamId') || '';
    }

    async function fetchJSON(url) {
      const response = await fetch(url);
      if (!response.ok) {
        const errorText = await response.text();
        console.error(`Error fetching ${url}:`, errorText);
        throw new Error(`Fetch failed: ${response.status} ${response.statusText}`);
      }
      return response.json();
    }

    async function analyzeLibrary() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const steamId = document.getElementById('steamId').value.trim();
      localStorage.setItem('apiKey', apiKey);
      localStorage.setItem('steamId', steamId);
      const region = document.getElementById('region').value;
      const excludeOwned = document.getElementById('excludeOwned').checked;
      const earlyAccess = document.getElementById('earlyAccess').checked;
      const demos = document.getElementById('demos').checked;
      const onlyOnSale = document.getElementById('onlyOnSale').checked;
      const minReviewScore = parseFloat(document.getElementById('minReviewScore').value) || 0;
      const minReviewCount = parseInt(document.getElementById('minReviewCount').value) || 0;
      const sortBy = document.getElementById('sortBy').value;
      const output = document.getElementById('output');
      output.innerHTML = '<p>Loading...</p>';

      try {
        const libraryData = await fetchJSON(`https://api.steampowered.com/IPlayerService/GetOwnedGames/v1/?key=${apiKey}&steamid=${steamId}&include_appinfo=true&include_played_free_games=true`);
        const games = libraryData.response.games;

        games.sort((a, b) => (b.playtime_forever + (b.rtime_last_played || 0) * 0.5) - (a.playtime_forever + (a.rtime_last_played || 0) * 0.5));

        output.innerHTML = '<div class="card"><h2>Your Top Weighted Games:</h2><ul>' +
          games.slice(0, 5).map(g => `<li>${g.name} - ${(g.playtime_forever / 60).toFixed(1)} hrs</li>`).join('') + '</ul></div>';

        let topGenres = {};
        for (const game of games.slice(0, 10)) {
          const appData = await fetchJSON(`https://store.steampowered.com/api/appdetails?appids=${game.appid}&cc=${region}`);
          const genres = appData[game.appid]?.data?.genres || [];
          genres.forEach(g => {
            if (!topGenres[g.description]) topGenres[g.description] = 0;
            topGenres[g.description]++;
          });
        }

        output.innerHTML += '<div class="card"><h2>Your Top Genres:</h2><ul>' +
          Object.entries(topGenres).sort((a, b) => b[1] - a[1]).map(([g, c]) => `<li>${g} (${c} games)</li>`).join('') + '</ul></div>';

        let recommendations = [];
        for (const genre of Object.keys(topGenres)) {
          const searchData = await fetchJSON(`https://store.steampowered.com/api/storesearch/?term=${genre}&cc=${region}&l=english`);
          recommendations = recommendations.concat(searchData.items);
        }

        recommendations = recommendations.filter(game => {
          if (excludeOwned && games.find(g => g.appid === game.id)) return false;
          if (!earlyAccess && game.early_access) return false;
          if (!demos && game.type === 'Demo') return false;
          if (onlyOnSale && (!game.price || !game.price.discount_percent)) return false;
          if (game.review_score / 10 < minReviewScore) return false;
          if (game.review_count < minReviewCount) return false;
          return true;
        });

        if (sortBy === 'price') {
          recommendations.sort((a, b) => (a.price?.final || 9999) - (b.price?.final || 9999));
        } else if (sortBy === 'discount') {
          recommendations.sort((a, b) => (b.price?.discount_percent || 0) - (a.price?.discount_percent || 0));
        }

        output.innerHTML += '<h2>Recommended Games:</h2>';
        recommendations.forEach(game => {
          const price = game.price ? `$${(game.price.final / 100).toFixed(2)}` : 'Free';
          const origPrice = game.price?.initial ? `$${(game.price.initial / 100).toFixed(2)}` : '';
          const discount = game.price?.discount_percent || 0;
          const discountClass = discount >= 50 ? 'discount-high' : discount >= 25 ? 'discount-medium' : 'discount-none';
          const review = game.review_score ? `${game.review_score}/10 (${game.review_count} reviews)` : 'No review data';
          output.innerHTML += `<div class="card">
            <a href="https://store.steampowered.com/app/${game.id}" target="_blank">${game.name}</a><br>
            <span>${review}</span><br>
            <span class="price ${discountClass}">${origPrice ? `${origPrice} → ` : ''}${price} ${discount ? `(-${discount}%)` : ''}</span>
          </div>`;
        });

      } catch (err) {
        console.error(err);
        output.innerHTML = `<p class="error">${err.message}</p>`;
      }
    }

    function downloadCSV() {
      alert("CSV export for recommendations coming soon.");
    }
  </script>
</body>
</html>
