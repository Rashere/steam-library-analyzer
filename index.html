<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Library Analyzer</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f8f9fa; }
    input, button { padding: 10px; margin: 8px 0; width: 100%; max-width: 500px; }
    .options { display: flex; flex-direction: column; align-items: start; margin: 10px 0; }
    .option-row { display: flex; align-items: center; margin: 5px 0; }
    .option-row input[type="checkbox"] { margin-right: 10px; }
    .error { color: red; }
    .container { max-width: 600px; margin: auto; text-align: center; }
    .recommendations, .similar-games { background: #e9f7ef; color: #155724; padding: 10px; margin-top: 15px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Steam Library Analyzer</h1>
    <p>Enter your SteamID64 or Profile URL and Steam API Key to analyze your library and get recommendations.</p>
    <input id="steamID" placeholder="SteamID64 or Profile URL" />
    <input id="apiKey" placeholder="Steam API Key" />
    <div class="options">
      <div class="option-row">
        <input type="checkbox" id="includeEarlyAccess" checked />
        <label for="includeEarlyAccess">Include Early Access games</label>
      </div>
      <div class="option-row">
        <input type="checkbox" id="includeDemos" checked />
        <label for="includeDemos">Include Demos</label>
      </div>
      <div class="option-row">
        <input type="checkbox" id="excludeOwned" />
        <label for="excludeOwned">Exclude games I already own</label>
      </div>
    </div>
    <button onclick="fetchSteamData()">Analyze My Library</button>
    <div id="recommendations" class="recommendations" style="display:none;"></div>
    <div id="similarGames" class="similar-games" style="display:none;"></div>
    <button id="downloadBtn" style="display:none;" onclick="downloadCSV()">Download CSV</button>
  </div>
  <script>
    // (existing JavaScript unchanged)
  </script>
</body>
</html>
